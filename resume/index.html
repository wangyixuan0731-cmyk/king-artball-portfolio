<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noimageindex" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Resume · King Artball</title>
    <style>
      @font-face {
        font-family: "Pixelify Sans";
        src: url("../assets/PixelifySans.ttf") format("truetype");
        font-display: swap;
        font-weight: 400 700;
      }

      :root {
        --ink: #4a241d;
        --cream: #fff6ca;
        --orange: #ff7427;
        --sun: #ffd34e;
        --coral: #ff7165;
      }

      * { box-sizing: border-box; }

      html {
        min-width: 1180px;
        min-height: 100%;
        background: var(--sun);
      }

      body {
        min-width: 1180px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family: "Pixelify Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          linear-gradient(rgba(255, 210, 75, 0.55), rgba(255, 178, 55, 0.42)),
          url("../assets/pixel-woodland-background-v2.png") center top / cover fixed no-repeat;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(255, 246, 202, 0.2), transparent 42%, rgba(255, 116, 39, 0.06));
      }

      .layout {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 300px minmax(760px, 900px);
        gap: 58px;
        width: min(1260px, calc(100vw - 120px));
        margin: 0 auto;
        padding: 58px 0 78px;
        align-items: start;
      }

      .side-panel {
        position: sticky;
        top: 58px;
        padding-top: 28px;
      }

      .kicker {
        display: inline-block;
        margin: 0 0 15px;
        padding: 7px 12px 5px;
        transform: rotate(-2deg);
        border: 3px solid var(--ink);
        background: var(--coral);
        box-shadow: 5px 5px 0 var(--ink);
        color: #fff8dd;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-size: 66px;
        line-height: 0.92;
        letter-spacing: -0.035em;
        text-shadow: 3px 3px 0 rgba(255, 246, 202, 0.75);
      }

      .name {
        width: max-content;
        margin: 20px 0 0;
        padding: 7px 10px 5px;
        border: 3px solid var(--ink);
        background: rgba(255, 246, 202, 0.92);
        box-shadow: 4px 4px 0 var(--ink);
        font-size: 23px;
        font-weight: 700;
      }

      .home-link {
        display: inline-block;
        margin-top: 27px;
        padding: 10px 18px 8px;
        border: 3px solid var(--ink);
        background: var(--orange);
        box-shadow: 5px 5px 0 var(--ink);
        color: #fff9df;
        font-size: 25px;
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
        transition: transform 120ms steps(2, end), filter 120ms steps(2, end);
      }

      .home-link:hover,
      .home-link:focus-visible {
        transform: translate(-2px, -3px);
        filter: saturate(1.12) brightness(1.06);
        outline: none;
      }

      .sparkles {
        margin-top: 24px;
        color: var(--orange);
        font-size: 27px;
        letter-spacing: 0.27em;
        text-shadow: 2px 2px 0 var(--cream);
      }

      .document-stage {
        position: relative;
        padding: 22px;
        border: 5px solid var(--ink);
        background: var(--cream);
        box-shadow: 12px 12px 0 rgba(74, 36, 29, 0.92);
      }

      .document-stage::before,
      .document-stage::after {
        content: "";
        position: absolute;
        width: 36px;
        height: 36px;
        background: var(--orange);
        border: 4px solid var(--ink);
      }

      .document-stage::before {
        top: -18px;
        right: 44px;
      }

      .document-stage::after {
        bottom: 36px;
        left: -20px;
        background: var(--coral);
      }

      .resume-page {
        display: block;
        width: 100%;
        height: auto;
        border: 3px solid var(--ink);
        background: #fff;
        user-select: none;
        -webkit-user-drag: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .home-link { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="layout" aria-label="King Artball 简历">
      <aside class="side-panel">
        <p class="kicker">MY FILE</p>
        <h1>resume</h1>
        <p class="name">King Artball</p>
        <a class="home-link" href="../">home</a>
        <div class="sparkles" aria-hidden="true">✦ ✦ ✦</div>
      </aside>

      <section class="document-stage" aria-label="简历页面预览">
        <img
          class="resume-page"
          src="assets/resume-page-01.webp"
          alt="王艺璇的简历，第 1 页"
          draggable="false"
          width="1408"
          height="1988"
        />
      </section>
    </main>
    <script>
      document.querySelector(".resume-page").addEventListener("contextmenu", (event) => event.preventDefault());
    </script>
  </body>
</html>
